<!DOCTYPE html>
<head>
    <meta charset="UTF-8"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="/bookFlight-screen/bookPayment.js" defer></script>
</head>
<body>
    <!-- Navigation bar for login and sign up-->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">FlyDream</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/travel">Travel Info</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/sign-in">Sign-up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="mx-auto p-2 mt-3" style="width: 500px;">
        <!--Creating search bar nav for the ticket-->
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm rounded-pill" style="margin-top: 56px;">
                <div class="container-fluid justify-content-center">
                    <ul class="navbar-nav justify-content-center">
                        <li class="nav-item border-end border-3 pe-2">
                            <a class="nav-link" href="/Front-end/bookFlight-screen/bookFlight-screen.html">Flights</a>
                        </li>
                        <li class="nav-item border-end border-3 pe-2">
                            <a class="nav-link" href="/Front-end/bookFlight-screen/bookSeat-screen.html">Seats</a>
                        </li>
                        <li class="nav-item border-end border-3 pe-2">
                            <a class="nav-link" href="/Front-end/bookFlight-screen/bookExtra-screen.html">Extra's</a>
                        </li>
                        <li class="nav-item border-end border-3 pe-2">
                            <a class="nav-link" href="/Front-end/bookFlight-screen/bookDetail.html">Details</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/Front-end/bookFlight-screen/bookPayment.html">Payment</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </div>



    <div class="d-flex justify-content-center m-5">
        <form class="w-75 border border-2 shadow mt-2">
            <h4 class="text-center">Payment Info</h4>
            <div class="gap-2 m-4">
                <div class ="row">
                    <div class="col mb-3 w-75">
                        <label for="cardName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="cardName" value="rami alasady" required>
                    </div>
                    <div class="col mb-3 w-75">
                        <label for="cardNum" class="form-label">Card-Number</label>
                        <input type="text" class="form-control" id="cardNum" value="5111-2342-6454-2345" required>
                    </div>
                </div>
                <div class="row">
                    <div class=" col mb-3 w-75">
                        <label for="cardCVC" class="form-label">CVC</label>
                        <input type="text" class="form-control" id="cardCVC" value="333" required>
                    </div>
                    <div class=" col mb-3 w-75">
                        <label for="expCard" class="form-label">Expiration-Date</label>
                        <input type="date" class="form-control" id="expCard" value="09/26" required>
                    </div>
                </div>
                <div class="row">
                    <div class=" col mb-3 w-75">
                        <label for="phoneNum" class="form-label">Phone-Number</label>
                        <input type="text" class="form-control" id="phoneNum" value="04768056" required>
                    </div>
                    <div class="col mb-3 w-75">
                        <label for="payEmail" class="form-label">Email</label>
                        <input type="text" class="form-control" id="payEmail" value="rami.alasady@gmail.com" required>
                    </div>
                </div>
                <div class="pt-5">
                    <h3>Total Cost:</h3>
                    <h3 id="ticketCost"></h3>
                    <div class="pt-3">
                        <legend>Summary</legend>
                        <div id="summaryCost"></div>
                    </div>
                </div>
                <div class="d-flex justify-content-center m-5">
                    <button type="button" class="btn btn-primary btn-lg mt-3" id="payConfirm">Submit</button>
                </div>
            </div>    
        </form>
    </div>
</body>
