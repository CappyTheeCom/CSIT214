<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyDreamAir | Flight Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/Travel-Info/user-flight.js" defer></script>
</head>


<body class="bg-gray-100 min-h-screen pt-16">
    <header class="bg-white py-4 shadow-md fixed top-0 left-0 right-0 z-50">
       <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">FlyDream</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/travel">Travel Info</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/login">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/sign-in">Sign-up</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto">
            <!-- Flight History Section -->
            <div class="mb-8">
                <h2 class="history-heading text-gray-900 mb-6">FLIGHT HISTORY</h2>

                <!-- Tabs -->
                <div class="border-b border-gray-200 mb-6">
                    <div class="flex space-x-8">
                        <button onclick="switchTab('upcoming')" class="tab-button tab-active py-2 font-medium">
                            Upcoming Flights
                        </button>
                        <button onclick="switchTab('past')" class="tab-button py-2 font-medium text-gray-500">
                            Past Flights
                        </button>
                    </div>
                </div>

                <!-- Tab Content -->
                <div id="upcoming" class="tab-content active">
                    <div class="max-w-4xl mx-auto">
                        <!-- Flight cards will be dynamically inserted here -->
                    </div>
                </div>

                <div id="past" class="tab-content">
                    <div class="max-w-4xl mx-auto">
                        <!-- Flight cards will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
