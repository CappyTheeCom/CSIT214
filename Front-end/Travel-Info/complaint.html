<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/Travel-info/complaint.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 min-h-screen pt-16">
        <!-- Navigation bar for login and sign up-->
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">FlyDream</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="/travel">Travel Info</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/login">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/sign-in">Sign-up</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        
        <div class="container border border-2 w-75 rounded-5">

            <div class=" py-4">
                <h3>Need a Reschedule or schedule?</h3>
            </div>

            <div>
                <div class="pb-4">
                    <h5>Leave your contact information here</h5>
                    <small>And tell us why?</small>
                </div>
                <form class="text-center">
                    <div class="row align-items-center mb-3 justify-content-center pt-3">
                        <label for="fname" class="fw-bold col-3">First-name: </label>
                        <input type="text" class="form-control w-50 col-5" id="fname" name="fname" required>
                    </div>
                    <div class="row align-items-center mb-3 justify-content-center pt-3">
                        <label for="lname" class="fw-bold col-3">Last-name: </label>
                        <input type="text" class="form-control w-50 col-5" id="lname" name="lname" required>
                    </div>
                    <div class="row align-items-center mb-3 justify-content-center pt-3">
                        <label for="uEmail" class="fw-bold col-3">Email: </label>
                        <input type="email" class="form-control w-50 col-5" id="uEmail" name="email" required>
                    </div>
                    <div class="row align-items-center mb-3 justify-content-center py-3">
                        <label for="phoneNum" class="fw-bold col-3">Phone: </label>
                        <input type="text" class="form-control w-50 col-5" id="phoneNum" name="phone" required>
                    </div>
                    <div class="pb-3">
                        <a href="/Home-screen/Home-screen.html">
                            <button type="button" class="btn btn-primary btn-lg" id="confirmBtn">Submit</button>
                        </a>
                    </div>
                </form>
            </div>
        </div>

</body>
</html>
